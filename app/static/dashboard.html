<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Local SQL Copilot</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 sidebar" id="sidebar">
          <h4>
            <i class="bi bi-database"></i>
            Database Schema
          </h4>

          <div id="schemaExplorer" class="schema-container">Loading...</div>

          <hr />

          <div class="d-flex justify-content-between align-items-center">
            <h5>
              <i class="bi bi-clock-history"></i>
              Recent Queries
            </h5>

            <button
              class="btn btn-sm btn-outline-light"
              onclick="clearHistory()"
            >
              Clear
            </button>
          </div>

          <ul id="history" class="history-list"></ul>
        </div>

        <!-- Main -->
        <div class="col-md-9 p-4" id="mainContent">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">
              <i class="bi bi-robot"></i>
              Local SQL Copilot
            </h2>

            <button
              id="sidebarToggle"
              class="btn btn-outline-primary"
              onclick="toggleSidebar()"
            >
              <i class="bi bi-table"></i>
              Hide Schema
            </button>
          </div>

          <div class="mt-3">
            <span id="status" class="badge bg-success"> Ready </span>

            <span id="confidenceBadge" class="badge bg-primary ms-2">
              Confidence: -
            </span>
          </div>

          <!-- Stats -->

          <!-- Upload -->
          <div class="card mt-4 card-shadow">
            <div class="card-header">Upload Dataset</div>

            <div class="card-body">
              <input type="file" id="csvFile" class="form-control" />

              <button class="btn btn-primary mt-3" onclick="uploadCSV()">
                Upload CSV
              </button>

              <div id="uploadStatus" class="mt-3"></div>

              <div id="tableInfo" class="mt-3"></div>
            </div>
          </div>

          <!-- Query -->
          <div class="card mt-4 card-shadow">
            <div class="card-header">Ask Question</div>

            <div class="card-body">
              <textarea
                id="question"
                class="form-control"
                rows="4"
                placeholder="Ask a question about your data..."
              ></textarea>

              <button class="btn btn-success mt-3" onclick="runQuery()">
                Generate SQL
              </button>

              <div
                class="spinner-border text-primary mt-3 loading-spinner"
                id="loading"
              ></div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="card mt-4 card-shadow">
            <div class="card-body">
              <ul class="nav nav-tabs">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#resultsTab"
                  >
                    Results
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#sqlTab"
                  >
                    SQL
                  </button>
                </li>

                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#repairTab"
                  >
                    Repairs
                  </button>
                </li>
              </ul>

              <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="resultsTab">
                
                    <div id="exportButtons" class="mb-3" style="display:none;">
                
                        <button class="btn btn-success me-2" onclick="exportCSV()">
                
                            Export CSV
                        </button>
                
                        <button class="btn btn-primary" onclick="exportExcel()">
                
                            Export Excel
                        </button>
                
                    </div>
                
                    <div id="results"></div>          </div>

                <div class="tab-pane fade" id="sqlTab">
                  <div
                    class="d-flex justify-content-between align-items-center mb-2"
                  >
                    <h6 class="mb-0">Original SQL</h6>

                    <button
                      class="btn btn-sm btn-outline-primary"
                      onclick="copyText('originalSql')"
                    >
                      Copy
                    </button>
                  </div>

                  <div id="originalSql" class="sql-box mb-4"></div>

                  <div
                    class="d-flex justify-content-between align-items-center mb-2"
                  >
                    <h6 class="mb-0">Final SQL</h6>

                    <button
                      class="btn btn-sm btn-outline-primary"
                      onclick="copyText('finalSql')"
                    >
                      Copy
                    </button>
                  </div>

                  <div id="finalSql" class="sql-box"></div>
                </div>

                <div class="tab-pane fade" id="repairTab">
                  <div id="repairInfo"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/schema.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/query.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
